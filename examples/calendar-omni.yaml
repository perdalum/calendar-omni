# Config for native today/tomorrow and legacy scripts; native last-week uses --calendar.
# Copy to ~/.calendar-omni. Calendar names match exactly, including case.
calendars:
  - Ugeplan
  # - "Komme-gå"

# Fields for legacy CSV scripts. Native daily/weekly report layouts are fixed.
fields:
  - title
  - start
  - end
  - location
  - attendees
  - notes

# simple: HH:MM for today/tomorrow. Native last-week always keeps full timestamps.
# full: preserve the original values, including seconds and time-zone offsets.
datetime_format: simple
